<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gerenciador de Tarefas Acadêmicas</title>

    <link rel="stylesheet" href="./styles.css">
</head>

<body>

    <header>
        <h1>Gerenciador de Tarefas Acadêmicas</h1>
        <p>Organize suas atividades, projetos e prazos acadêmicos.</p>
    </header>

    <main>

        <section class="controles" aria-labelledby="titulo-filtros">

            <h2 id="titulo-filtros">Busca e Filtros</h2>

            <div class="campo-busca">
                <label for="busca">Buscar por título:</label>

                <input
                    type="search"
                    id="busca"
                    placeholder="Digite o título da tarefa">
            </div>

            <fieldset>
                <legend>Filtrar por status:</legend>

                <div>
                    <input
                        type="radio"
                        id="status-todos"
                        name="status"
                        value="todos"
                        checked>

                    <label for="status-todos">Todos</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="status-fazer"
                        name="status"
                        value="fazer">

                    <label for="status-fazer">A fazer</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="status-andamento"
                        name="status"
                        value="andamento">

                    <label for="status-andamento">Em andamento</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="status-revisao"
                        name="status"
                        value="revisao">

                    <label for="status-revisao">Em revisão</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="status-concluida"
                        name="status"
                        value="concluida">

                    <label for="status-concluida">Concluída</label>
                </div>
            </fieldset>

            <fieldset>
                <legend>Filtrar por prioridade:</legend>

                <div>
                    <input
                        type="radio"
                        id="prioridade-todas"
                        name="prioridade"
                        value="todas"
                        checked>

                    <label for="prioridade-todas">Todas</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="prioridade-baixa"
                        name="prioridade"
                        value="baixa">

                    <label for="prioridade-baixa">Baixa</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="prioridade-media"
                        name="prioridade"
                        value="media">

                    <label for="prioridade-media">Média</label>
                </div>

                <div>
                    <input
                        type="radio"
                        id="prioridade-alta"
                        name="prioridade"
                        value="alta">

                    <label for="prioridade-alta">Alta</label>
                </div>

            </fieldset>

            <div class="ordenacao">
                <label for="ordenacao">Ordenar por prazo:</label>

                <select id="ordenacao">
                    <option value="padrao">Ordem original</option>
                    <option value="crescente">Prazo mais próximo</option>
                    <option value="decrescente">Prazo mais distante</option>
                </select>
            </div>

            <button type="button" id="limpar-filtros">
                Limpar filtros
            </button>

        </section>


        <!-- Já existe no HTML antes de o JavaScript executar -->
        <div
            id="status-interface"
            role="status"
            aria-live="polite">
        </div>


        <section class="quadro-tarefas">

            <section class="coluna" data-status="fazer">

                <h2>A fazer</h2>

                <ul></ul>

            </section>


            <section class="coluna" data-status="andamento">

                <h2>Em andamento</h2>

                <ul></ul>

            </section>


            <section class="coluna" data-status="revisao">

                <h2>Em revisão</h2>

                <ul></ul>

            </section>


            <section class="coluna" data-status="concluida">

                <h2>Concluída</h2>

                <ul></ul>

            </section>

        </section>

    </main>


    <footer>
        <p>Rayane Araújo — Desenvolvimento Frontend 2026.2</p>
    </footer>


    <script type="module" src="./js/main.js"></script>

</body>

</html>
