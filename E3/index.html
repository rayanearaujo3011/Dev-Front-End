<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Gerenciador de Tarefas Acadêmicas
    </title>

    <link
        rel="stylesheet"
        href="styles.css"
    >
</head>

<body>

    <header>
        <h1>
            Gerenciador de Tarefas Acadêmicas
        </h1>
    </header>


    <main>

        <section
            class="filtros"
            aria-labelledby="filtros-titulo"
        >

            <h2 id="filtros-titulo">
                Busca e Filtros
            </h2>


            <form>

                <div class="campo-busca">

                    <label for="busca-tarefa">
                        Buscar por título:
                    </label>

                    <input
                        type="text"
                        id="busca-tarefa"
                        name="busca-tarefa"
                    >

                </div>


                <fieldset>

                    <legend>
                        Filtrar por status:
                    </legend>


                    <div>
                        <input
                            type="radio"
                            id="status-todos"
                            name="status"
                            value="todos"
                            checked
                        >

                        <label for="status-todos">
                            Todos
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="status-fazer"
                            name="status"
                            value="fazer"
                        >

                        <label for="status-fazer">
                            A fazer
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="status-andamento"
                            name="status"
                            value="andamento"
                        >

                        <label for="status-andamento">
                            Em andamento
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="status-revisao"
                            name="status"
                            value="revisao"
                        >

                        <label for="status-revisao">
                            Em revisão
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="status-concluida"
                            name="status"
                            value="concluida"
                        >

                        <label for="status-concluida">
                            Concluída
                        </label>
                    </div>

                </fieldset>


                <fieldset>

                    <legend>
                        Filtrar por prioridade:
                    </legend>


                    <div>
                        <input
                            type="radio"
                            id="prioridade-todas"
                            name="prioridade"
                            value="todas"
                            checked
                        >

                        <label for="prioridade-todas">
                            Todas
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="prioridade-baixa"
                            name="prioridade"
                            value="baixa"
                        >

                        <label for="prioridade-baixa">
                            Baixa
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="prioridade-media"
                            name="prioridade"
                            value="media"
                        >

                        <label for="prioridade-media">
                            Média
                        </label>
                    </div>


                    <div>
                        <input
                            type="radio"
                            id="prioridade-alta"
                            name="prioridade"
                            value="alta"
                        >

                        <label for="prioridade-alta">
                            Alta
                        </label>
                    </div>

                </fieldset>

            </form>

        </section>


        <div
            id="status-interface"
            role="status"
            aria-live="polite"
        ></div>


        <section
            class="coluna"
            data-status="fazer"
            aria-labelledby="titulo-fazer"
        >

            <h2 id="titulo-fazer">
                A fazer
            </h2>

            <ul></ul>

        </section>


        <section
            class="coluna"
            data-status="andamento"
            aria-labelledby="titulo-andamento"
        >

            <h2 id="titulo-andamento">
                Em andamento
            </h2>

            <ul></ul>

        </section>


        <section
            class="coluna"
            data-status="revisao"
            aria-labelledby="titulo-revisao"
        >

            <h2 id="titulo-revisao">
                Em revisão
            </h2>

            <ul></ul>

        </section>


        <section
            class="coluna"
            data-status="concluida"
            aria-labelledby="titulo-concluida"
        >

            <h2 id="titulo-concluida">
                Concluída
            </h2>

            <ul></ul>

        </section>

    </main>


    <footer>

        <p>
            Rayane Araújo — Desenvolvimento Frontend 2026.2
        </p>

    </footer>


    <script
        type="module"
        src="./js/main.js"
    ></script>

</body>

</html>
